
name: Build EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C++
        run: g++ GG.cpp -o GG.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-exe
          path: GG.exe
