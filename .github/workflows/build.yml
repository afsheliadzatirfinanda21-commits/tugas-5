
name: Build GG EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check File
        run: |
          if (!(Test-Path "GG.cpp")) {
            Write-Error "GG.cpp tidak ditemukan!"
            exit 1
          }

      - name: Compile C++
        run: g++ -std=c++17 GG.cpp -o GG.exe -static -static-libgcc -static-libstdc++

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GG-exe
          path: GG.exe
